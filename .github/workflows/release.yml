name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-latest
            compression: maximum
          # One job builds both architectures so latest-mac.yml contains both ZIPs.
          - platform: mac
            runner: macos-15-intel
            compression: normal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        if: github.event_name == 'push'
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) { console.error("Tag must match package.json version: v" + p.version); process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Silence macOS file scanners
        if: matrix.platform == 'mac'
        run: |
          # XProtect/Spotlight scan mounted DMG volumes and hold them open, which
          # makes electron-builder's `hdiutil detach` fail with "Resource busy"
          # (actions/runner-images#7522).
          sudo mdutil -a -i off || true
          sudo pkill -9 -fi XProtect || true
          sudo pkill -9 mdworker || true

      - name: Build packages
        env:
          GH_TOKEN: ${{ github.token }}
          # No Apple Developer certificate is required for CI packages.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          PUBLISH_MODE: ${{ github.event_name == 'push' && 'always' || 'never' }}
          COMPRESSION: ${{ matrix.compression }}
        shell: bash
        run: |
          max_attempts=2
          attempt=1
          until npm run build:${{ matrix.platform }} -- --publish "$PUBLISH_MODE" --config.compression="$COMPRESSION"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Build failed after $attempt attempts."
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Build attempt $((attempt - 1)) failed; retrying (attempt $attempt of $max_attempts)..."
            if [ "${{ matrix.platform }}" = "mac" ]; then
              # Scanners respawned around the failed attempt's mounted volumes.
              sudo pkill -9 -fi XProtect || true
              sudo pkill -9 mdworker || true
            fi
            sleep 30
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: CS-Explorer-${{ matrix.platform }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
