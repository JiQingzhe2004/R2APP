name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-latest
            compression: maximum
          # One job builds both architectures so latest-mac.yml contains both ZIPs.
          - platform: mac
            runner: macos-15-intel
            compression: normal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        if: github.event_name == 'push'
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) { console.error("Tag must match package.json version: v" + p.version); process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        env:
          GH_TOKEN: ${{ github.token }}
          # No Apple Developer certificate is required for CI packages.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          PUBLISH_MODE: ${{ github.event_name == 'push' && 'always' || 'never' }}
          COMPRESSION: ${{ matrix.compression }}
        shell: bash
        run: npm run build:${{ matrix.platform }} -- --publish "$PUBLISH_MODE" --config.compression="$COMPRESSION"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: CS-Explorer-${{ matrix.platform }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
